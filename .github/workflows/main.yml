name: Release

on:
  push:
    tags:
      - 'v*'   # 匹配 v0.0.1, v0.0.8 等标签

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install

      - name: Build and zip (Chrome)
        run: pnpm zip

      - name: Build and zip (Firefox)
        run: pnpm zip:firefox

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            .output/*.zip
          generate_release_notes: true